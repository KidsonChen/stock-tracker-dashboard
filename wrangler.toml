name = "stock-tracker-dashboard"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist/public"
min_node_version = "20"

# 平臺 Git 連接模式 build：先裝依賴再產出 dist/public
# 注意：平臺預設套件管理器是 pnpm（偵測到 pnpm-lock.yaml），故用 pnpm 而非 npm
# （用 npm 會因與 pnpm-lock 混用而報 "Cannot read properties of null (reading 'matches')"）
[build]
command = "pnpm install && pnpm run build:cf"

# R2 bucket（取代本地 DuckDB / D1）：儲存 watchlist + analysis_cache 為 JSON 物件
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "stock-tracker-bucket"

# 生產環境環境變數（敏感值請用 wrangler secret put 設定，不要寫在這裡）
[vars]
NODE_ENV = "production"
ROUTER_AI_BASE_URL = "https://openrouter.ai/api/v1"
ROUTER_AI_MODEL = "openrouter/auto"
