name = "stock-tracker-dashboard"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist/public"

# R2 bucket（取代本地 DuckDB / D1）：儲存 watchlist + analysis_cache 為 JSON 物件
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "stock-tracker-bucket"

# 生產環境環境變數（敏感值請用 wrangler secret put 設定，不要寫在這裡）
[vars]
NODE_ENV = "production"
ROUTER_AI_BASE_URL = "https://openrouter.ai/api/v1"
ROUTER_AI_MODEL = "openrouter/auto"

# 注意：Pages 專案的 wrangler.toml 不支援 [build] / min_node_version 欄位
# （那是 Workers 語法）。Build command 與 Node 版本請在
# Dashboard → Settings → Build 設定：
#   Build command: pnpm install && pnpm run build:cf
#   Build output directory: dist/public
#   Node.js version: 20
